name: Deploy watchmovie

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-watchmovie
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint PHP
        run: for f in $(find . -name '*.php' -not -path './.git/*'); do php -l "$f" >/dev/null || exit 1; done

      - name: Generate secrets.php from GitHub secrets
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          WATCHMODE_API_KEY: ${{ secrets.WATCHMODE_API_KEY }}
          STATS_KEY: ${{ secrets.STATS_KEY }}
        run: |
          if [ -z "$TMDB_ACCESS_TOKEN" ]; then echo "::error::TMDB_ACCESS_TOKEN secret is missing"; exit 1; fi
          {
            echo "<?php"
            printf "define('TMDB_ACCESS_TOKEN', '%s');\n" "$TMDB_ACCESS_TOKEN"
            printf "define('WATCHMODE_API_KEY', '%s');\n" "${WATCHMODE_API_KEY:-}"
            if [ -n "$STATS_KEY" ]; then printf "define('STATS_KEY', '%s');\n" "$STATS_KEY"; fi
          } > secrets.php

      # Uploads only changed files over encrypted FTPS. Deploy state is tracked in a
      # small file on the server, so files removed from the repo are removed there too.
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .DS_Store
            **/.DS_Store
            _legacy/**
            secrets.example.php
            README.md
            cache/**

      - name: Remove secrets from runner
        if: always()
        run: rm -f secrets.php
